name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: Install PlanetScale CLI
        run: |
          curl -fsSL https://github.com/planetscale/cli/releases/latest/download/pscale_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin pscale
          pscale version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Typecheck
        run: bun run typecheck

      - name: E2E (AIMock + PlanetScale branch)
        run: bun run test:e2e
        env:
          CI: '1'
          E2E_DB_BACKEND: planetscale
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          # e2e/run.ts starts Docker is skipped; AIMock + Temporal + e2e worker
          # are started by global-setup. App is on :3100.
