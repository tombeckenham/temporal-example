name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"
          temporal --version

      - name: Setup pscale
        uses: planetscale/setup-pscale-action@v1

      - name: Verify PlanetScale secrets
        env:
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        run: |
          missing=0
          for name in PLANETSCALE_ORG PLANETSCALE_DATABASE PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set (add it under repo Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          pscale version
          echo "PlanetScale secrets present; pscale CLI ready"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install chromium --with-deps

      - name: Typecheck
        run: bun run typecheck

      - name: E2E (AIMock + PlanetScale branch)
        run: bun run test:e2e
        env:
          CI: '1'
          E2E_DB_BACKEND: planetscale
          PLANETSCALE_ORG: ${{ secrets.PLANETSCALE_ORG }}
          PLANETSCALE_DATABASE: ${{ secrets.PLANETSCALE_DATABASE }}
          PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
          PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
          # e2e/run.ts prepares DB + .dev.vars; global-setup starts AIMock,
          # Temporal (if needed), and the e2e worker. App is on :3100.
